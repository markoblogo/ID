[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id-protocol"
version = "0.5.1"
description = "Git-like protocol and tooling for portable human-AI identity context"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "markoblogo" }]
license = "MIT"
keywords = ["ai", "context", "interop", "protocol", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
idctl = "idcli:main"

[tool.setuptools]
py-modules = ["idcli", "id_soul", "id_diff"]
packages = ["scripts"]

[project.optional-dependencies]
dev = [
  "coverage>=7.8.0",
  "hypothesis>=6.133.0",
]

[tool.setuptools.package-data]
scripts = ["*.sh"]

[tool.setuptools.data-files]
"share/id-protocol/templates" = ["templates/*.md", "templates/*.json"]
"share/id-protocol/schemas" = ["schemas/*.json"]

[project.urls]
Homepage = "https://github.com/markoblogo/ID"
Documentation = "https://github.com/markoblogo/ID/tree/main/docs"
Issues = "https://github.com/markoblogo/ID/issues"
