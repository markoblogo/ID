name: id-protocol-release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine && python -m pip install ".[dev]"

      - name: Validate repo
        run: make validate

      - name: Require reproducible artifacts and test coverage
        run: |
          make drift-check
          make coverage
          python - <<'PYCODE'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PYCODE

      - name: Build package artifacts
        run: make release-build

      - name: Check package metadata
        run: make release-check

      - name: Test installed release and pinned companions
        run: |
          python -m venv /tmp/id-wheel
          /tmp/id-wheel/bin/pip install dist/*.whl agentsgen==0.5.0 abvx-set==0.3.1
          PATH="/tmp/id-wheel/bin:$PATH" /tmp/id-wheel/bin/python scripts/id_release_smoke.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Trigger PyPI publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pypi-publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f release_tag="${GITHUB_REF_NAME}"
