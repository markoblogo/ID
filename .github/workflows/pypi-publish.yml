name: id-protocol-pypi-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish from
        required: true
        type: string

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern "*.whl" \
            --pattern "*.tar.gz"

      - name: Verify downloaded wheel before publishing
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python -m venv /tmp/id-wheel
          /tmp/id-wheel/bin/pip install dist/*.whl agentsgen==0.5.0 abvx-set==0.3.1
          PATH="/tmp/id-wheel/bin:$PATH" /tmp/id-wheel/bin/python scripts/id_release_smoke.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
